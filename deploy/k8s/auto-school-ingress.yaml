apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: auto-school
  namespace: auto-school
  annotations:
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
    - outbound
  routes:
    - kind: Rule
      match: Host(`school.vanderloch.com`) && PathPrefix(`/outpost.goauthentik.io/`)
      services:
        # authentik-server fronts the embedded outpost paths (port 80); the
        # bare `authentik-outpost` service doesn't exist in this cluster.
        # This route is what makes Logout (/outpost.goauthentik.io/signout) work.
        - name: authentik-server.authentik.svc.cluster.local
          port: 80
          scheme: http
    - kind: Rule
      match: Host(`school.vanderloch.com`)
      middlewares:
        - name: authentik-forwardauth
      services:
        - name: auto-school
          port: 80
          scheme: http
  tls:
    secretName: lochis-tls
