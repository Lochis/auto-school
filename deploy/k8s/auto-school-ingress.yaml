apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: auto-school
  namespace: auto-school
  annotations:
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
    - outbound
  routes:
    - kind: Rule
      match: Host(`school.vanderloch.com`) && PathPrefix(`/outpost.goauthentik.io/`)
      services:
        # signout/auth handshake endpoints live on the embedded OUTPOST service
        # (port 9000) — authentik-server:80 answers /auth/* but 404s /signout.
        # This route is what makes Logout (/outpost.goauthentik.io/signout) work.
        - name: ak-outpost-authentik-embedded-outpost.authentik.svc.cluster.local
          port: 9000
          scheme: http
    # Machine-to-machine routes: NO forwardAuth. An external recorder/client
    # authenticates with `Authorization: Bearer $INGEST_TOKEN` /
    # `$RECORDER_TOKEN` (constant-time compared in the route handlers), which
    # forwardAuth would never let through — the request was 302'd to the
    # authentik login before the app saw it. Both routes are POST-only and
    # fail closed (401) when their token env is unset, so this is not a
    # bypass of the app's auth. Traefik ranks by rule length, so these
    # PathPrefix rules win over the plain Host() catch-all below; `priority`
    # makes that explicit rather than incidental.
    # They carry NO edge marker (they never pass the outpost), so
    # frontend/src/middleware.ts strips X-authentik-* / X-Auto-School-User /
    # X-Internal-Auth from them exactly like any other untrusted request —
    # neither route reads those headers, they resolve their owner from the
    # Bearer token + body only.
    - kind: Rule
      priority: 100
      match: Host(`school.vanderloch.com`) && (PathPrefix(`/api/ingest/session`) || PathPrefix(`/api/recorder/heartbeat`))
      services:
        - name: auto-school
          port: 80
          scheme: http
    - kind: Rule
      match: Host(`school.vanderloch.com`)
      middlewares:
        # ORDER IS LOAD-BEARING (security-hardening.md §3): forwardAuth first,
        # then the marker — Traefik only runs the next middleware after the
        # auth server allows the request, so X-Edge-Secret is stamped ONLY on
        # requests that actually went through the authentik outpost. The app
        # (frontend/src/middleware.ts) strips client-supplied
        # X-authentik-* / X-Auto-School-User / X-Internal-Auth from everything
        # that lacks the marker. Render the marker value from the Secret first
        # (see authentik-edge.yaml) — an unrendered one fails closed (401).
        - name: authentik-forwardauth
        - name: auto-school-edge-marker
      services:
        - name: auto-school
          port: 80
          scheme: http
  tls:
    secretName: lochis-tls
