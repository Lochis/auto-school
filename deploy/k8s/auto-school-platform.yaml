# auto-school-frontend — the Next.js frontend (+ Postgres via auto-school-pg).
# Matches live Deployment auto-school-frontend (reconciled 2026-10-30 —
# previously drifted as auto-school-platform: the live object was renamed at
# cutover, so applying the old name/selectors would have created a SECOND
# Deployment colliding on the Service selector. Names below now match live,
# so `kubectl apply -f deploy/k8s/` converges the live object instead).
#
# 5a-FINAL state (recorder-split.md §5): daemon-less by default. The recording
# daemon lives in deploy/k8s/auto-school-recorder.yaml; this pod has NO daemon
# container, NO /data mount, NO node pin — it resolves the owner's recorder via
# the registry (lib/backend.ts resolveRecorder) and degrades cleanly when none
# is attached.
#
# APPLY ATOMICALLY WITH auto-school-recorder.yaml (never one without the other —
# running both the recorder pod AND the old single-pod manifest would run two
# daemons on the same RWO PVC; the legacy deploy/auto-school is scaled to 0,
# see auto-school.yaml). At cutover:
#   1. kubectl apply -f auto-school-recorder.yaml -f auto-school-platform.yaml
#   2. legacy deploy/auto-school stays at replicas=0 (rollback path only)
# Prerequisites (once, before cutover):
#   * apply src/db/ddl.sql to Postgres (recorders table) — else heartbeats 500
#     and the registry never populates (silently masked by daemon-less mode)
#   * kubectl create secret ... auto-school-env with RECORDER_TOKEN (both pods
#     read it; without it heartbeats 401 and the platform stays daemon-less)
#   * the same Secret MUST carry BOTH edge secrets (32+ random bytes, hex each,
#     generate with `openssl rand -hex 32`) as REQUIRED secretKeyRefs below:
#       - EDGE_MARKER: the plaintext X-Edge-Secret header value the Authentik
#         edge stamps and the frontend checks (lib/auth.ts, middleware.ts).
#         Rendering it into a Traefik Middleware means it is liftable from a
#         header-logging proxy — which is why it is NOT the HMAC key.
#       - INTERNAL_HMAC_KEY: the HMAC-SHA256 key for the frontend→daemon hop
#         (lib/owner.ts daemonUserHeaders → X-Internal-Auth). Never rendered
#         into an edge component, so it never leaves the two pods.
#     Render the matching Traefik marker from EDGE_MARKER (see authentik-edge.yaml).
---
apiVersion: v1
kind: Namespace
metadata:
  name: auto-school
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auto-school-frontend
  namespace: auto-school
  labels:
    app: auto-school-frontend
spec:
  replicas: 1
  strategy: { type: RollingUpdate } # no PVC coupling — frontend rolls freely
  selector:
    matchLabels:
      app: auto-school-frontend
  template:
    metadata:
      labels:
        app: auto-school-frontend
    spec:
      terminationGracePeriodSeconds: 300
      imagePullSecrets:
        - name: reg-credentials-ghcr
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        # ── frontend: serves every user; resolves the owner's recorder via the
        #    registry first (BACKEND_URL below is only the dead fallback)
        - name: frontend
          image: ghcr.io/lochis/auto-school-frontend:latest
          imagePullPolicy: Always
          env:
            - { name: AUTO_SCHOOL_DATA, value: /data } # legacy path prefix for fs fallback constants only — no mount
            # Transitional fallback read by lib/backend.ts resolveRecorder when
            # the recorder registry has no fresh heartbeat for the owner.
            # Points at the legacy controller Service, which is endpoint-less
            # since the 2026-10-30 scale-down of deploy/auto-school — registry
            # resolution is the live path, so the dead fallback is benign.
            # Kept to match the live pod's env exactly.
            - { name: BACKEND_URL, value: "http://auto-school-ctrl:7800" }
            - { name: TZ, value: America/Toronto }
            - { name: TRUST_AUTHENTIK_HEADERS, value: "1" }
            - { name: AUTHENTIK_ADMIN_GROUP, value: auto-school-admins }
            # NOT declared (present on the live pod but stale — reconciling an
            # apply will drop them): AUTHENTIK_API_URL / AUTHENTIK_API_TOKEN —
            # zero references in frontend/src (the avatar flow reads users.avatar,
            # no provider API call; see the Gap-4 note in auto-school.yaml), and
            # EDGE_SECRET — retired key, superseded by EDGE_MARKER above/below.
            - name: EDGE_MARKER
              # REQUIRED (security-hardening.md §3): the shared edge marker
              # (deploy/k8s/authentik-edge.yaml stamps it, frontend/src/middleware.ts
              # verifies it). Plaintext header value by design — kept SEPARATE
              # from the daemon-hop HMAC key so a leaked marker cannot forge an
              # internal hop. No `optional: true`: a missing key must stop the
              # rollout, not silently degrade to an unverifiable edge
              # (requireUser() 401s).
              valueFrom:
                secretKeyRef: { name: auto-school-env, key: EDGE_MARKER }
            - name: INTERNAL_HMAC_KEY
              # REQUIRED: the HMAC-SHA256 key for the internal daemon-hop proof
              # (lib/owner.ts daemonUserHeaders → X-Internal-Auth). Distinct from
              # EDGE_MARKER; never shipped to the edge.
              valueFrom:
                secretKeyRef: { name: auto-school-env, key: INTERNAL_HMAC_KEY }
            # recorder registry auth: the frontend verifies daemon heartbeats
            # with this token (same key as the recorder pod's env)
            - name: RECORDER_TOKEN
              valueFrom:
                secretKeyRef: { name: auto-school-env, key: RECORDER_TOKEN, optional: true }
            # ingestion API auth (POST /api/ingest/session): shared secret the
            # Electron client sends as Bearer; unset → 401 (fail closed)
            - name: INGEST_TOKEN
              valueFrom:
                secretKeyRef: { name: auto-school-env, key: INGEST_TOKEN, optional: true }
            - { name: DB_READS, value: "1" }
            # ── platform AI generation (5b-2 c, docs/planning/platform-ai-generation.md) ──
            # Keys are OPTIONAL and resolved env → app_settings system row
            # (src/db/llm-keys.ts) — never the fs (this pod has no /data mount).
            # Unset → generation routes fail closed; the pod still serves.
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef: { name: auto-school-env, key: GEMINI_API_KEY, optional: true }
            - name: GLM_API_KEY
              valueFrom:
                secretKeyRef: { name: auto-school-env, key: GLM_API_KEY, optional: true }
            # flips the platform into the in-pod generator role (recorder sends
            # capture only, transcribe stays on the recorder — D3/D4/D5)
            - { name: PLATFORM_AI, value: "1" }
            - { name: PGHOST, value: auto-school-pg }
            - { name: PGPORT, value: "5432" }
            - { name: PGDATABASE, value: autoschool }
          envFrom:
            - secretRef: { name: auto-school-pg }
          ports:
            - { containerPort: 3000, name: http }
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 30
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: auto-school
  namespace: auto-school
spec:
  # matches the live selector: the ingress (auto-school-ingress.yaml) routes
  # Host(school.vanderloch.com) → this Service → the frontend pods
  selector: { app: auto-school-frontend }
  ports:
    - { name: http, port: 80, targetPort: http }
# IngressRoute + basicAuth Middleware live in auto-school-ingress.yaml (unchanged):
# it routes Host(school.vanderloch.com) → Service auto-school:80.
