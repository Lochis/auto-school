# auto-school-platform — the Next.js frontend (+ Postgres via auto-school-pg).
# 5a-FINAL state (recorder-split.md §5): daemon-less by default. The recording
# daemon lives in deploy/k8s/auto-school-recorder.yaml; this pod has NO daemon
# container, NO /data mount, NO node pin — it resolves the owner's recorder via
# the registry (lib/backend.ts resolveRecorder) and degrades cleanly when none
# is attached.
#
# APPLY ATOMICALLY WITH auto-school-recorder.yaml (never one without the other —
# running both the recorder pod AND the old single-pod manifest would run two
# daemons on the same RWO PVC). At cutover:
#   1. kubectl apply -f auto-school-recorder.yaml -f auto-school-platform.yaml
#   2. kubectl delete -f deploy/k8s/auto-school.yaml   # retire the single-pod manifest
# Prerequisites (once, before cutover):
#   * apply src/db/ddl.sql to Postgres (recorders table) — else heartbeats 500
#     and the registry never populates (silently masked by daemon-less mode)
#   * kubectl create secret ... auto-school-env with RECORDER_TOKEN (both pods
#     read it; without it heartbeats 401 and the platform stays daemon-less)
---
apiVersion: v1
kind: Namespace
metadata:
  name: auto-school
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auto-school-platform
  namespace: auto-school
  labels:
    app: auto-school
spec:
  replicas: 1
  strategy: { type: RollingUpdate } # no PVC coupling — platform rolls freely
  selector:
    matchLabels:
      app: auto-school
  template:
    metadata:
      labels:
        app: auto-school
    spec:
      terminationGracePeriodSeconds: 300
      imagePullSecrets:
        - name: reg-credentials-ghcr
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        # ── frontend: serves every user; resolves the owner's recorder via the
        #    registry only (no BACKEND_URL — daemon-less resolution by default)
        - name: frontend
          image: ghcr.io/lochis/auto-school-frontend:latest
          imagePullPolicy: Always
          env:
            - { name: AUTO_SCHOOL_DATA, value: /data } # legacy path prefix for fs fallback constants only — no mount
            - { name: TZ, value: America/Toronto }
            - { name: TRUST_AUTHENTIK_HEADERS, value: "1" }
            - { name: AUTHENTIK_ADMIN_GROUP, value: auto-school-admins }
            - name: EDGE_SECRET
              valueFrom:
                secretKeyRef: { name: auto-school-env, key: EDGE_SECRET, optional: true }
            # recorder registry auth: the platform verifies daemon heartbeats
            # with this token (same key as the recorder pod's env)
            - name: RECORDER_TOKEN
              valueFrom:
                secretKeyRef: { name: auto-school-env, key: RECORDER_TOKEN, optional: true }
            - { name: DB_READS, value: "1" }
            - { name: PGHOST, value: auto-school-pg }
            - { name: PGPORT, value: "5432" }
            - { name: PGDATABASE, value: autoschool }
          envFrom:
            - secretRef: { name: auto-school-pg }
          ports:
            - { containerPort: 3000, name: http }
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 30
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: auto-school
  namespace: auto-school
spec:
  selector: { app: auto-school }
  ports:
    - { name: http, port: 80, targetPort: http }
# IngressRoute + basicAuth Middleware live in auto-school-ingress.yaml (unchanged):
# it routes Host(school.vanderloch.com) → Service auto-school:80.
